<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<main class="container">
    <header class="glass header">
        <div>
            <h1>DevOps Task Manager</h1>
            <p class="subtitle">Built by Maven · Tested · Deployed by Jenkins &amp; Ansible · by Shaik Sameer</p>
        </div>
        <div class="build-badge" id="buildBadge">
            <span class="dot"></span>
            <span id="buildText">loading build…</span>
        </div>
    </header>

    <section class="stats">
        <div class="glass stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Total</span></div>
        <div class="glass stat"><span class="stat-num cyan" id="statPending">0</span><span class="stat-label">Pending</span></div>
        <div class="glass stat"><span class="stat-num violet" id="statDone">0</span><span class="stat-label">Completed</span></div>
    </section>

    <section class="glass">
        <form id="taskForm" class="task-form">
            <input id="taskTitle" type="text" placeholder="Add a task, e.g. Configure SonarQube" maxlength="120" required>
            <select id="taskPriority">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>
            <button type="submit">Add task</button>
        </form>
        <p class="error" id="formError"></p>

        <ul id="taskList" class="task-list"></ul>
    </section>

    <footer class="footer">
        <a href="/actuator/health" target="_blank">Health check</a> ·
        <a href="/api/info" target="_blank">Build info</a> ·
        <a href="/api/tasks" target="_blank">REST API</a>
    </footer>
</main>

<script src="app.js"></script>
</body>
</html>
