spring.application.name=taskmanager
server.port=${PORT:8080}

# Values injected by Maven resource filtering at build time
app.version=@project.version@
# BUILD_NUMBER is set by Ansible at start-up; otherwise the number Maven built with is used
app.build-number=${BUILD_NUMBER:@build.number@}
app.environment=${APP_ENV:local}

# Health endpoint used by Ansible and the pipelines after deployment
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.build.enabled=true
