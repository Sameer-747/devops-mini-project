# "local": deploys to the same machine Jenkins runs on (your laptop). No SSH needed.
[local]
localhost ansible_connection=local

# "azure": an Ubuntu VM on Azure. Replace the IP with your VM's public IP
# (Azure Pipelines overrides it with -e ansible_host=$(VM_HOST)).
[azure]
azure-vm ansible_host=20.0.0.10 ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/azure_vm_key
